name: Secret check

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  no-local-supabase-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a committed supabase-config.js
        run: |
          if git ls-files --error-unmatch public/streamer/supabase-config.js >/dev/null 2>&1; then
            echo "::error::public/streamer/supabase-config.js is tracked. Remove it from git, rotate the Supabase key, and commit the example instead."
            exit 1
          fi
